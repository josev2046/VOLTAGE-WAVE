  theme:{
    extend:{
      fontFamily:{
        sans:['Inter','sans-serif'],

      },

<style>
body { background: #050505; color: #d4d4d8; overflow-x: hidden; }
.scanlines::before {
  content: " "; display: block; position: absolute; inset: 0;
  background: linear-gradient(rgba(18,16,16,0) 50%,rgba(0,0,0,.25) 50%),
              linear-gradient(90deg,rgba(245,158,11,.04),rgba(245,158,11,.02),rgba(217,119,6,.04));
  z-index: 50; background-size: 100% 2px,3px 100%; pointer-events: none; opacity: .3;
}
.bg-synth-grid {
  background-image: linear-gradient(to right,rgba(245,158,11,.07) 1px,transparent 1px),
                    linear-gradient(to bottom,rgba(245,158,11,.07) 1px,transparent 1px);
  background-size: 40px 40px;
}

/* Base Panel Styling */
.schematic-panel {
  background: #d4d4d8;
  border-radius: 0.75rem;
  border: 1px solid #27272a;
  box-shadow: 0 10px 20px -5px rgba(0,0,0,.8);
  padding: 0.5rem;
  position: relative;
  transition: all 0.1s cubic-bezier(0.4, 0, 0.2, 1);
  will-change: transform, box-shadow, background-color;
  --ac: 245, 158, 11;
}

/* Dynamic Active State */
.schematic-panel.playing {
  background: rgba(var(--ac), 0.2); 
  border-color: rgba(var(--ac), 0.9);
  box-shadow: 0 0 50px rgba(var(--ac), 0.6);
  transform: scale(1.02);
  z-index: 20;
}
.schematic-panel:not(.playing):hover {
  transform: translateY(-2px);
  box-shadow: 0 15px 25px -5px rgba(var(--ac), 0.2);
}

.panel-label {
  position: absolute;
  top: 0.75rem;
  left: 0.75rem;
  background: rgba(9,9,11,0.85);
  backdrop-filter: blur(4px);
  border: 1px solid rgba(var(--ac), 0.5);
  color: rgb(var(--ac));
  padding: 0.25rem 0.75rem;
  border-radius: 0.25rem;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.7rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  z-index: 10;
  box-shadow: 0 0 10px rgba(var(--ac), 0.1);
}
.note-indicator {
  position: absolute;
  top: 0.75rem;
  right: 0.75rem;
  background: rgba(var(--ac), 0.1);
  border: 1px solid rgb(var(--ac));
  color: rgb(var(--ac));
  padding: 0.25rem 0.5rem;
  border-radius: 0.25rem;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.7rem;
  font-weight: 700;
  opacity: 0.15;
  transition: opacity 0.05s, transform 0.05s;
  z-index: 10;
}
.note-indicator.active { 
  opacity: 1; 
  background: rgba(var(--ac), 0.5);
  color: #fff;
  transform: scale(1.05);
  box-shadow: 0 0 15px rgba(var(--ac), 0.8);
}

/* Dynamic SVG Elements */
svg.ms { display: block; width: 100%; height: auto; touch-action: none; user-select: none; -webkit-user-select: none; }
svg.ms text { font-family: 'JetBrains Mono', monospace; font-stretch: 90%; }
.cab { fill: none; stroke-linecap: round; }
.kw { fill: #fff; stroke: #3f3f46; stroke-width: 1.2; transition: fill 0.05s; }
.kb { fill: #18181b; transition: fill 0.05s; }
.kw.on { fill: rgba(var(--ac), 0.35); stroke: rgb(var(--ac)); }
.kb.on { fill: rgb(var(--ac)); }

/* Scope Toggles */
.scope-chip {
  padding: 0.25rem 0.75rem;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.65rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  border-radius: 0.25rem;
  border: 1px solid #27272a;
  background: #09090b;
  color: #71717a;
  transition: all 0.2s;
  cursor: pointer;
}
.scope-chip:hover { background: #18181b; color: #fff; }
.scope-chip.on {
  border-color: rgb(var(--ac));
  background: rgba(var(--ac), 0.25);
  color: rgb(var(--ac));
  box-shadow: 0 0 10px rgba(var(--ac), 0.4);
}
</style>
</head>
<body class="antialiased relative selection:bg-amber-500 selection:text-zinc-950 flex flex-col min-h-screen">
<div class="scanlines fixed inset-0 pointer-events-none z-50"></div>

<!-- Top Navigation & Controls -->
<nav class="fixed w-full z-40 top-0 bg-[#050505]/90 backdrop-blur-md border-b border-zinc-800">
  <div class="max-w-[100rem] mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between items-center h-16">
      <div class="flex items-center gap-4">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square" class="text-amber-500 w-6 h-6"><path d="M2 12h4v-7h6v14h6v-7h4"/></svg>
        <span class="font-mono text-sm font-bold text-white tracking-widest uppercase hidden sm:block">Motorik <span class="text-amber-500">Sequence</span></span>
      </div>
      <div class="flex items-center gap-3">
        <button id="playBtn" class="px-4 py-1.5 rounded bg-amber-600 text-zinc-950 font-mono text-xs font-bold uppercase tracking-wider hover:bg-amber-500 transition-colors shadow-[0_0_10px_rgba(245,158,11,0.4)]">▶ Boot</button>
        <button id="stopBtn" class="px-4 py-1.5 rounded border border-zinc-700 bg-zinc-800 text-zinc-300 font-mono text-xs font-bold uppercase tracking-wider hover:bg-zinc-700 transition-colors disabled:opacity-30" disabled>■ Halt</button>
        <a href="index.html" class="font-mono text-xs text-zinc-400 hover:text-amber-500 transition-colors ml-4 border-l border-zinc-800 pl-4 hidden sm:block">← Back</a>
      </div>
    </div>
  </div>
</nav>

<!-- Main Workspace -->
<main class="pt-24 pb-12 bg-[#050505] flex-1 relative z-10">
  <div class="absolute inset-0 bg-synth-grid pointer-events-none [mask-image:linear-gradient(to_bottom,white,transparent)] -z-10"></div>
  <div class="px-4 sm:px-6 lg:px-8 w-full max-w-[100rem] mx-auto flex flex-col gap-8">
    
    <div class="flex flex-col gap-2">
      <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full border border-amber-500/30 bg-amber-500/10 text-amber-500 font-mono text-xs w-max">
        <span class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span>
        DÜSSELDORF-SCHOOL EMULATION
      </div>
      <p class="text-sm text-zinc-400 font-light leading-relaxed max-w-4xl mt-2">
        A 32-bar generative arrangement featuring a rigid 16th-note motorik bassline, classic synthetic drum triggers, singing triangle lead, string-machine pads, and a prominent VC-10 formant vocoder.
      </p>
    </div>

    <!-- TOP ROW: Compact Mixer & Master Scope side-by-side -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 items-stretch w-full">
      <div id="mixer-container" class="w-full flex"></div>
      <div class="schematic-panel w-full flex flex-col h-full" style="--ac: 161, 161, 170;">
        <div class="flex justify-between items-center px-4 py-2 border-b border-zinc-800 bg-[#0a0a0c] rounded-t-lg mb-2">
          <span class="font-mono text-xs text-zinc-400 font-bold uppercase tracking-widest flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-zinc-400 animate-pulse"></span> Multi-Track Scope
          </span>
          <div class="flex gap-2">
            <button class="scope-chip on" data-m="0">Wave</button>
            <button class="scope-chip" data-m="1">Freq</button>
          </div>
        </div>
        <div class="relative flex-1 bg-[#020617] rounded-b-lg overflow-hidden border border-zinc-800 min-h-[140px]">
          <canvas id="cv" class="absolute inset-0 w-full h-full block"></canvas>
        </div>
      </div>
    </div>

    <!-- SYNTH ROW: Grid of 12 Instruments -->
    <div id="schematic-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>

  </div>
</main>

<footer class="py-8 text-center border-t border-zinc-800 bg-[#050505] relative z-20">
  <a href="https://voltageandwave.co.uk/" target="_blank" rel="noopener noreferrer" class="font-mono text-xs text-zinc-500 hover:text-amber-500 transition-colors uppercase tracking-widest">
    Powered by Voltage & Wave
  </a>
</footer>

<script>
/* Configuration Data & Constants */
const K={pt:2,pw:3,po:4,ex:5,fmM:6,fmE:7,fc:8,pk:9,fcM:10,fcE:11,mgF:13,H:14,A:15,D:16,S:17,R:18};
const J={FM:[540,277], PWM:[565,277], EXT:[610,277], FC:[635,277], VCA:[700,277], MGT:[540,377], MGS:[565,377], EGR:[610,377], TRG:[775,352], PINK:[540,437], WHT:[640,437], WHL:[690,437]};
const WH=[0,2,4,6,7,9,11],NS=[];
for(let i=0;i<19;i++)NS.push(WH[i%7]+12*Math.floor(i/7));
const BL=[1,3,5,8,10,13,15,17,20,22,25,27,29];
const KW=720/19,KX=130;

const BPM = 125;
const B = 60 / BPM, bar = 4 * B, LOOP_DUR = 32 * bar;

// Kraftwerk-style Synthetic Palette + VC-10
const PATCH_DATA = {
  kick:   { name: "Analog Kick",     rgb: "255, 0, 85",   s: [32,'t',0,null,0,1,0,0,4.5,8,0,4,null,null,0,0,1,0,1], cab: ['PINK>EXT'] },
  snare:  { name: "White Snare",     rgb: "250, 100, 0",  s: [0,'n',0,null,0,5,0,0,6,3,0,6,'s',0,0,0,2.5,0,1.5], cab: ['WHT>EXT'] },
  hat:    { name: "Closed Hat",      rgb: "255, 200, 0",  s: [0,'n',0,null,0,0,0,0,8,0,0,2,'s',0,0,0,1.0,0,0.5], cab: ['WHT>EXT'] },
  bass:   { name: "Motorik Bass",    rgb: "0, 255, 135",  s: [32,'q',0,2,0,null,0,0,5,7,0,6,null,null,0,0,1,4,1], cab: [] },
  lead:   { name: "Melody (Tri)",    rgb: "0, 234, 255",  s: [16,'t',0,null,0,null,1.2,0,5.2,2.5,0,3,'t',4.5,0,1.5,2.5,8,2.5], cab: [] },
  arp:    { name: "16th Seq",        rgb: "0, 102, 255",  s: [8,'t',0,null,0,null,1,1,5.5,4,3,8,'t',3.5,0,1,1,5,1], cab: [] },
  pad1:   { name: "String Mach. 1",  rgb: "157, 0, 255",  s: [8,'q',0,5,0,null,1,0,7,2,0,0,'t',3,0,5,0,10,5], cab: [] },
  pad2:   { name: "String Mach. 2",  rgb: "213, 0, 255",  s: [8,'q',0,6,0,null,1,0,7,2,0,0,'t',3,0,5,0,10,5], cab: [] },
  pad3:   { name: "String Mach. 3",  rgb: "255, 0, 212",  s: [8,'q',0,4,0,null,1,0,7,2,0,0,'t',3,0,5,0,10,5], cab: [] },
  zap:    { name: "Kraft-Zap",       rgb: "50, 255, 50",  s: [0,'s',0,null,0,null,0,0,8,9,0,10,'s',6,0,0,0,0,1], cab: [] },
  noise:  { name: "Noise Sweep",     rgb: "200, 255, 255",s: [0,'n',0,null,0,0,0,0,6,8,0,5,'t',1,6,5,0,0,5], cab: ['PINK>EXT'] },
  vocoder:{ name: "VC-10 VOCODER",   rgb: "255, 140, 0",  s: [16,'s',0,null,0,null,0,0,10,0,0,0,null,null,0,0.5,1,10,1.5], cab: [] }
};

const MIX_CFG = [
  {id: 'kick', name: 'KIK', def: 0.95, max: 2}, {id: 'snare', name: 'SNR', def: 0.75, max: 2},
  {id: 'hat', name: 'HAT', def: 0.25, max: 1},  {id: 'bass', name: 'BAS', def: 0.85, max: 2},
  {id: 'lead', name: 'LED', def: 0.45, max: 1}, {id: 'arp', name: 'ARP', def: 0.32, max: 1},
  {id: 'pad1', name: 'PD1', def: 0.14, max: 0.5},{id: 'pad2', name: 'PD2', def: 0.14, max: 0.5},
  {id: 'pad3', name: 'PD3', def: 0.14, max: 0.5},{id: 'zap', name: 'ZAP', def: 0.35, max: 1},
  {id: 'noise', name: 'NSE', def: 0.25, max: 1}, {id: 'vocoder', name: 'VC10', def: 1.45, max: 2.5},
  {id: 'master', name: 'MST', def: 0.85, max: 1.5, rgb: "161, 161, 170"}
];

let mixState = {};
MIX_CFG.forEach(c => mixState[c.id] = c.def);

/* ---------- Render SVG Engines ---------- */
const G={t:'M-9 5L0 -6L9 5',s:'M-8 6V-6L8 6',q:'M-9 4V-4H-3V4H3V-4H9',n:'M-9 0L-7 -5L-5 4L-3 -3L-1 5L1 -4L3 3L5 -5L7 2L9 -1'};
const fv=(k,v)=>v==null?'':(k==='pt'&&v>0?'+'+v:''+v);
function knob(x,y,lab,k,s,o={}){const v=s[K[k]],p=o.ptr; const ang=(v/10*270-135);let t=p?(v==null?'':`<line x1="0" y1="0" x2="0" y2="-17" stroke-width="2.4" transform="rotate(${ang})"/>`):`<text y="5" font-size="${fv(k,v).length>2?12:15}" text-anchor="middle" font-weight="600">${fv(k,v)}</text>`; const ly=o.top?y-26:o.mid?y+25:y+27; return `<g transform="translate(${x},${y})"><circle r="17" fill="#fff" stroke="#18181b" stroke-width="1.6"/>${t}<text y="${ly-y}" font-size="9.5" text-anchor="middle">${lab}</text></g>`}
function sw(x,y,lab,w,type,s,mid){let inner=''; if(type==='sc'){inner=s[0]?`<text y="5" font-size="16" text-anchor="middle" font-weight="600">${s[0]}′</text>`:''} else{const g=G[w];inner=g?`<path d="${g}" fill="none" stroke="#18181b" stroke-width="1.8" transform="scale(1.1)"/>`:''} return `<g transform="translate(${x},${y})"><circle r="19" fill="#fff" stroke="#18181b" stroke-width="1.6"/>${inner}<text y="${mid?25:30}" font-size="9.5" text-anchor="middle">${lab}</text></g>`}
function hexJ(id, cab){const [x,y]=J[id],on=cab.some(c=>c.split('>').includes(id)); return `<g transform="translate(${x},${y})"><polygon points="-8,-3.5 -3.5,-8 3.5,-8 8,-3.5 8,3.5 3.5,8 -3.5,8 -8,3.5" fill="#fff" stroke="#18181b" stroke-width="1.6"/>${on?'<circle r="4.2" fill="#18181b"/>':''}</g>`}
function cable(a,b){const [x1,y1]=J[a],[x2,y2]=J[b];let d; if(Math.abs(y2-y1)<30){const dr=34+Math.abs(x2-x1)*.25;d=`M${x1} ${y1}C${x1} ${y1+dr},${x2} ${y2+dr},${x2} ${y2}`} else{const o=-(38+Math.abs(y2-y1)*.1);d=`M${x1} ${y1}C${x1+o} ${y1+(y2-y1)*.25},${x2+o} ${y2-(y2-y1)*.25},${x2} ${y2}`} return `<path class="cab" d="${d}" stroke="#18181b" stroke-width="6" fill="none" stroke-linecap="round"/><path class="cab" d="${d}" stroke="rgb(var(--ac))" stroke-width="3" fill="none" stroke-linecap="round"/>`}
const bx=(x,y,w,t)=>`<rect x="${x}" y="${y}" width="${w}" height="22" fill="#fff" stroke="#18181b" stroke-width="1.5"/><text x="${x+w/2}" y="${y+15}" font-size="10.5" text-anchor="middle">${t}</text>`;

function buildVC10SchematicSVG(instId) {
  const ln=(a,b,c,d)=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}"/>`;
  const vcKnob=(x,y,deg)=>{
    const rad = deg * Math.PI / 180;
    const x1 = Math.sin(rad) * 3, y1 = -Math.cos(rad) * 3;
    const x2 = Math.sin(rad) * 19, y2 = -Math.cos(rad) * 19;
    return `<g transform="translate(${x},${y})"><circle r="17" fill="#fff" stroke="#18181b" stroke-width="1.6"/><line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="#18181b" stroke-width="2.2" stroke-linecap="round"/></g>`;
  };
  const vcJack=(x,y)=>`<g transform="translate(${x},${y})"><circle r="10.5" fill="#fff" stroke="#18181b" stroke-width="1.6"/><circle r="6" fill="#18181b"/><circle r="3.2" fill="#fff"/></g>`;

  const wNames = ['F1','G1','A1','B1','C1','D2','E2','F2','G2','A2','B2','C2','D3','E3','F3','G3','A3','B3','C3'];
  const bNames = ['F♯1','G♯1','A♯1','C♯2','D♯2','F♯2','G♯2','A♯2','C♯3','D♯3','F♯3','G♯3','A♯3'];
  const ribs = Array.from({length: 19}, (_, i) => ln(83, 520 + i*7, 103, 520 + i*7)).join('');

  return `<svg id="svg_${instId}" class="ms" viewBox="52 178 806 500" xmlns="http://www.w3.org/2000/svg" stroke="#18181b" fill="none" stroke-width="1.6">
    <!-- Main Front Panel -->
    <rect x="60" y="185" width="790" height="315" fill="#f4f4f5" rx="4"/>
    ${ln(150,185,150,395)}
    ${ln(60,395,468,395)}
    ${ln(468,185,468,500)}
    ${ln(768,185,768,500)}

    <!-- Top-Left: TUNE & OCTAVE -->
    ${vcKnob(105, 226, 0)}
    <g fill="#18181b" stroke="none" font-size="9.5" font-weight="600" text-anchor="middle">
      <text x="84" y="246">♭</text>
      <text x="126" y="246">♯</text>
      <text x="105" y="261">TUNE</text>
    </g>

    <!-- OCTAVE Slide Switch -->
    <rect x="97" y="294" width="16" height="32" fill="#fff"/>
    <rect x="97" y="310" width="16" height="16" fill="#52525b"/>
    ${ln(97,315,113,315)}${ln(97,320,113,320)}
    <path d="M 88 299 L 88 321 M 85 303 L 88 298 L 91 303 M 85 317 L 88 322 L 91 317" stroke-width="1.3"/>
    <g fill="#18181b" stroke="none" font-size="9.5" font-weight="600">
      <text x="118" y="303">UP</text>
      <text x="105" y="345" text-anchor="middle">OCTAVE</text>
    </g>

    <!-- Upper-Middle: VU Meter, Bus & MIC LEVEL -->
    <rect x="246" y="198" width="124" height="66" fill="#fff" stroke-width="1.6"/>
    <path d="M 263 224 Q 308 214 353 224" stroke-width="1.6"/>
    <line x1="308" y1="264" x2="284" y2="213" stroke-width="1.8"/>
    <line x1="281" y1="218" x2="289" y2="214" stroke-width="1.4"/>

    <!-- Meter Switch & Routing Bus -->
    ${ln(308,264,308,278)}
    <rect x="294" y="278" width="28" height="14" fill="#fff"/>
    <rect x="308" y="278" width="14" height="14" fill="#52525b"/>
    ${ln(186,285,294,285)}
    ${ln(186,285,186,315)}
    ${ln(264,285,264,315)}
    ${vcKnob(186, 332, -135)}
    ${vcKnob(264, 332, -135)}

    <!-- MIC LEVEL Knob with Level Arc -->
    ${vcKnob(408, 332, -135)}
    <path d="M 387 332 A 21 21 0 1 1 426 322" stroke-width="1.3"/>
    <path d="M 422 318 L 427 323 L 421 325" stroke-width="1.3"/>
    <text x="408" y="368" fill="#18181b" stroke="none" font-size="9.5" font-weight="600" text-anchor="middle">MIC LEVEL</text>

    <!-- Lower-Left Row: 4 Knobs & Switch -->
    ${vcKnob(105, 445, -135)}
    ${vcKnob(186, 445, 0)}
    ${vcKnob(264, 445, 135)}
    <path d="M 186 470 L 186 479 L 264 479 L 264 470" stroke-width="1.5"/>
    <rect x="329" y="429" width="14" height="30" fill="#fff"/>
    <rect x="329" y="444" width="14" height="15" fill="#52525b"/>
    ${ln(329,449,343,449)}${ln(329,454,343,454)}
    ${vcKnob(408, 445, 135)}

    <!-- Right Section: POWER FIN VOL. & Vertical Knob Stack -->
    ${vcKnob(708, 228, -45)}
    <path d="M 692 213 A 21 21 0 1 1 726 239" stroke-width="1.3"/>
    <path d="M 728 234 L 726 240 L 721 236" stroke-width="1.3"/>
    <text x="708" y="264" fill="#18181b" stroke="none" font-size="9.5" font-weight="600" text-anchor="middle">POWER FIN VOL.</text>
    ${vcKnob(708, 332, -135)}
    ${vcKnob(708, 445, -135)}

    <!-- Far-Right Jacks Column -->
    ${vcJack(809, 212)}
    ${ln(819, 212, 850, 212)}
    <text x="809" y="236" fill="#18181b" stroke="none" font-size="9" font-weight="600" text-anchor="middle">MIC IN</text>

    ${vcJack(809, 264)}
    ${ln(819, 264, 850, 264)}
    <text x="809" y="288" fill="#18181b" stroke="none" font-size="9" font-weight="600" text-anchor="middle">FINAL OUT</text>

    <circle cx="809" cy="322" r="9.5" fill="#fff"/>
    <circle cx="809" cy="396" r="9.5" fill="#fff"/>
    <circle cx="809" cy="445" r="9.5" fill="#fff"/>

    <!-- Left Ribbed Wheel -->
    <g>
      <rect x="60" y="500" width="66" height="170" fill="#e4e4e7"/>
      <rect x="83" y="514" width="20" height="142" fill="#fff"/>
      ${ribs}

    <!-- 32-Key Keyboard with Note Labels -->

/* ---------- Audio Engine & Playback Logic ---------- */
let ac, outG, isPlaying = false, startTime = 0, nextLoopTime = 0, raf;
let tracks = {}; let uiEvents = [];
let nW, nP;
let scopeMode = 0; 

const mapFc=v=>40*Math.pow(2,v*.9),mgHz=v=>.5*Math.pow(2,.93*(v||0)),tm=v=>v<=0?.003:.003*Math.pow(10,.36*v),dm=v=>Math.max(.06,tm(v));

function initAudio(){
  if(ac) return;
  ac=new (window.AudioContext||window.webkitAudioContext)();
  const cp=ac.createDynamicsCompressor();
  outG=ac.createGain();
  outG.gain.value=mixState.master;
  
  cp.connect(outG);
  outG.connect(ac.destination);
  ac.cp=cp;
  
  const L=ac.sampleRate*3;nW=ac.createBuffer(1,L,ac.sampleRate);nP=ac.createBuffer(1,L,ac.sampleRate);
  const w=nW.getChannelData(0),p=nP.getChannelData(0);let a=0,b=0,c=0,d=0,e=0,f=0,g=0;
  for(let i=0;i<L;i++){const x=Math.random()*2-1;w[i]=x;a=.99886*a+x*.0555179;b=.99332*b+x*.0750759;c=.969*c+x*.153852;d=.8665*d+x*.3104856;e=.55*e+x*.5329522;f=-.7616*f-x*.016898;p[i]=(a+b+c+d+e+f+g+x*.5362)*.12;g=x*.115926}
}

function buildVoice(id, pData){
  const s=pData.s, v={all:[], tm:[], P: pData}, N=(f,...a)=>ac[f](...a);
  const src=(t,f)=>{const o=N('createOscillator');o.type=t;o.frequency.value=f;o.start();v.all.push(o);return o};
  const G=(g=1)=>{const n=N('createGain');n.gain.value=g;return n};
  const cs=()=>{const o=N('createConstantSource');o.offset.value=0;o.start();v.all.push(o);return o};
  const nz=b=>{const o=N('createBufferSource');o.buffer=b;o.loop=true;o.start();v.all.push(o);return o};
  
  v.eg=cs();v.wh=cs();
  v.mg=src(({t:'triangle',s:'sawtooth',q:'square'})[s[12]]||'triangle',1);v.mgT=src('triangle',1);v.mgS=src('square',1);
  
  const memo={};const S=n=>memo[n]||(memo[n]=({EG:()=>v.eg,EGR:()=>{const g=G(-1);v.eg.connect(g);return g},WHL:()=>v.wh,MGT:()=>v.mgT,MGS:()=>v.mgS,PINK:()=>{const g=G(.3);nz(nP).connect(g);return g},WHT:()=>{const g=G(.2);nz(nW).connect(g);return g}})[n]());
  const jk=(d,def)=>{const c=pData.cab.find(c=>c.endsWith('>'+d));return c?c.split('>')[0]:def};
  const nzs=n=>n==='PINK'||n==='WHT'?.5:1;
  
  v.vcf=N('createBiquadFilter');v.vcf.type='lowpass';const pre=G(.5);pre.connect(v.vcf);
  v.fb=G(1);v.fb.connect(v.vcf.detune);
  
  if(s[1]==='n') S('WHT').connect(pre);
  else if(s[0]){
    if(s[1]==='q'){v.osc=src('triangle',200);const m=G(1),ws=N('createWaveShaper'),c=new Float32Array(512);for(let i=0;i<512;i++)c[i]=i<256?-1:1;ws.curve=c;v.pwc=cs();v.osc.connect(m);v.pwc.connect(m);m.connect(ws);const q=G(.45);ws.connect(q);q.connect(pre);const pm=jk('PWM');if(pm){v.gPwm=G(.8);S(pm).connect(v.gPwm);v.gPwm.connect(v.pwc.offset)}}
    else{v.osc=src(s[1]==='s'?'sawtooth':'triangle',200);v.osc.connect(pre)}
    v.gFmM=G(0);v.mg.connect(v.gFmM);v.gFmM.connect(v.osc.detune);const fs=jk('FM','EG');v.gFmE=G(0);S(fs).connect(v.gFmE);v.gFmE.connect(v.osc.detune);v.fm=nzs(fs)
  }
  const ex=jk('EXT');if(ex){v.gEx=G(0);S(ex).connect(v.gEx);v.gEx.connect(pre)}
  v.gFcM=G(0);v.mg.connect(v.gFcM);v.gFcM.connect(v.fb);const fcs=jk('FC','EG');v.gFcE=G(0);S(fcs).connect(v.gFcE);v.gFcE.connect(v.fb);v.fc=nzs(fcs);
  v.so=src('sine',500);v.so.detune.value=0;v.fb.connect(v.so.detune);v.sg=G(0);v.so.connect(v.sg);
  
  const vca = G(0);
  
  if (id === 'vocoder') {
    pre.disconnect(v.vcf);
    v.vcf.disconnect(); 
    const vSum = G(5.8);
    const formants = [
      { f: 400,  q: 9, g: 1.1 },
      { f: 850,  q: 9, g: 1.0 },
      { f: 1450, q: 8, g: 0.55 },
      { f: 2450, q: 7, g: 0.45 },
      { f: 3400, q: 7, g: 0.3 }
    ];
    v.formantFilters = formants.map(fm => {
      const bp = N('createBiquadFilter');
      bp.type = 'bandpass';
      bp.frequency.value = fm.f;
      bp.Q.value = fm.q;
      const fGain = G(fm.g);
      pre.connect(bp);
      bp.connect(fGain);
      fGain.connect(vSum);
      return bp;
    });
    vSum.connect(vca);
  } else {
    v.vcf.connect(vca);
    v.sg.connect(vca);
  }
  
  const vsum=G(.5),clip=N('createWaveShaper');clip.curve=new Float32Array([0,0,2]);vsum.connect(clip);clip.connect(vca.gain);
  const ge=G(.9);v.eg.connect(ge);ge.connect(vsum);
  const vs=jk('VCA');if(vs){const g=G(.9);S(vs).connect(g);g.connect(vsum)}
  
  v.out=G(mixState[id]); 
  vca.connect(v.out);
  v.out.connect(ac.cp);

  v.an = ac.createAnalyser();
  v.an.fftSize = 2048;
  v.an.smoothingTimeConstant = 0.75;
  v.out.connect(v.an);
  
  const t=ac.currentTime,st=(p,x)=>p.setTargetAtTime(x,t,.02);
  const hzf=mapFc(s[8]);st(v.vcf.frequency,hzf);st(v.vcf.Q,s[9]*2.4);st(v.so.frequency,hzf);
  const mf=mgHz(s[13]);[v.mg,v.mgT,v.mgS].forEach(o=>st(o.frequency,mf));
  v.osc&&st(v.osc.detune,s[2]*100);
  v.gFmM&&st(v.gFmM.gain,s[6]*40);v.gFmE&&st(v.gFmE.gain,s[7]*267*v.fm);
  st(v.gFcM.gain,s[10]*270);st(v.gFcE.gain,s[11]*540*v.fc);
  st(v.sg.gain,Math.max(0,Math.min(1,(s[9]-8)/2))*.4);
  v.pwc&&st(v.pwc.offset,(s[3]==null?0:s[3]/10*1.8-.9));v.gEx&&st(v.gEx.gain,2*Math.pow((s[5]||0)/10,.7));
  
  return v;
}

const hold=(o,t,on)=>{if(o.cancelAndHoldAtTime){o.cancelAndHoldAtTime(t);o.setValueAtTime(o.value,t)}else{o.cancelScheduledValues(t);if(on)o.setValueAtTime(0,t);else o.setValueAtTime(o.value,t)}};
function schedOn(v, at) {
  const s = v.P.s, o = v.eg.offset, a = tm(s[15]), h = tm(s[14]);
  hold(o, at, 1);
  o.linearRampToValueAtTime(1, at + a);
  o.setValueAtTime(1, at + a + (s[14]?h:0));
  o.setTargetAtTime(s[17]/10, at + a + (s[14]?h:0), dm(s[16])/3);
}
function schedOff(v, at) {
  const o = v.eg.offset;
  hold(o, at, 0);
  o.setTargetAtTime(0, at, Math.max(.004, dm(v.P.s[18])/3));
}

function bootSystem() {
  initAudio();
  ac.resume();
  
  if(Object.keys(tracks).length === 0) {
    Object.keys(PATCH_DATA).forEach(id => {
      tracks[id] = buildVoice(id, PATCH_DATA[id]);
    });
  }
  
  startTime = ac.currentTime + 0.05;
  nextLoopTime = startTime;
  
  scheduleLoop();
  isPlaying = true;
  setPlaybackState(true);
  raf = requestAnimationFrame(uiLoop);
  requestAnimationFrame(drawScope);
}

function scheduleLoop() {
  const t0 = nextLoopTime;
  const fq = m => 440*Math.pow(2,(m-69)/12);
  
  const hit = (id, t, d) => {
    const v = tracks[id];
    schedOn(v, t); schedOff(v, t+d);
    uiEvents.push({ time: t, id, type: 'on', note: null });
    uiEvents.push({ time: t+d, id, type: 'off', note: null });
  };
  
  const nt = (id, t, d, m) => {
    const v = tracks[id];
    const f = fq(m) * ({32:.25, 16:.5, 8:1, 4:2})[v.P.s[0]];
    v.osc.frequency.setValueAtTime(f, t);
    hit(id, t, d);
    let visNote = m - 36;
    while(visNote > 28) visNote -= 12;
    while(visNote < 0) visNote += 12;
    if([...NS, ...BL].includes(visNote)) {
      uiEvents.push({ time: t, id, type: 'keyOn', note: visNote });
      uiEvents.push({ time: t+d, id, type: 'keyOff', note: visNote });
    }
  };

  const CHORDS = [
    { r: 48, p: [60, 63, 67] }, // Cm
    { r: 43, p: [55, 58, 62] }, // Gm
    { r: 41, p: [53, 56, 60] }, // Fm
    { r: 48, p: [60, 63, 67] }  // Cm
  ];

  const BASS_PAT = [
    [0,0], [0.25,0], [0.5,12], [0.75,0], [1,0], [1.25,0], [1.5,12], [1.75,0],
    [2,0], [2.25,0], [2.5,12], [2.75,0], [3,0], [3.25,0], [3.5,12], [3.75,0]
  ];

  const LEAD_A = [
    [[0, 72, .45], [.5, 75, .45], [1, 72, .45], [1.5, 67, .9],  [2.5, 68, .45], [3, 67, .9]],
    [[0, 70, .45], [.5, 72, .45], [1, 70, .45], [1.5, 62, .9],  [2.5, 63, .45], [3, 62, .9]],
    [[0, 68, .45], [.5, 70, .45], [1, 68, .45], [1.5, 60, .9],  [2.5, 62, .45], [3, 60, .9]],
    [[0, 72, .7],  [.75, 75, .65], [1.5, 67, 2.2]]
  ];

  const VOC_PAT = [
    [0,    0.38, 400, 800,  12],
    [0.5,  0.38, 560, 950,  12],
    [1.0,  0.45, 720, 1180, 15],
    [1.75, 0.45, 310, 2150, 14],
    [2.5,  1.10, 460, 1850, 12]
  ];

  for (let b = 0; b < 32; b++) {
    const tb = t0 + b * bar;
    const section = Math.floor(b / 8); 
    const c = CHORDS[Math.floor((b % 8) / 2)];

    if (section > 0 || b >= 4) {
      [0, 1, 2, 3].forEach(i => hit('kick', tb + i*B, .15));
      [1, 3].forEach(i => hit('snare', tb + i*B, .15));
      for(let i=0; i<16; i++) hit('hat', tb + i*(B/4), B*.05);
    }

    if (section > 0 || b >= 4) {
      BASS_PAT.forEach(([off, oct]) => nt('bass', tb + off*B, B*.15, c.r + oct));
    }

    if (section >= 1) {
      c.p.forEach((m, x) => nt('pad'+(x+1), tb, bar, m));
    }

    if (section === 1 || section === 2) {
      for(let i=0; i<16; i++) nt('arp', tb + i*(B/4), B*.15, c.p[i % 3] + 12);
    }

    if (section === 1 || section === 3) {
      LEAD_A[b % 4].forEach(([off, m, d]) => nt('lead', tb + off*B, d*B*.85, m));
    }

    if (section === 2 || (section === 1 && b >= 12) || (section === 3 && b >= 28)) {
      VOC_PAT.forEach(([off, d, f1, f2, pOff]) => {
        const vt = tb + off * B;
        if (tracks.vocoder && tracks.vocoder.formantFilters) {
          tracks.vocoder.formantFilters[0].frequency.setValueAtTime(f1, vt);
          tracks.vocoder.formantFilters[1].frequency.setValueAtTime(f2, vt);
        }
        nt('vocoder', vt, d * B * 0.9, c.r + pOff);
      });
    }

    if (b === 7 || b === 15 || b === 23) hit('zap', tb + 3.5*B, B*.5);
    if (b === 8 || b === 24) hit('noise', tb, bar);
  }

  nextLoopTime += LOOP_DUR;
  uiEvents.sort((a,b) => a.time - b.time);
}

function uiLoop() {
  if(!isPlaying) return;
  const t = ac.currentTime;
  
  if (t > nextLoopTime - 2.0) {
    scheduleLoop();
  }

  const el = Math.max(0, t - startTime);
  const mins = Math.floor(el / 60);
  const secs = Math.floor(el % 60).toString().padStart(2, '0');
  
  const timerEl = document.getElementById('timer');
  if(timerEl) timerEl.textContent = `${mins}:${secs}`;
  
  while(uiEvents.length > 0 && uiEvents[0].time <= t) {
    const ev = uiEvents.shift();
    
    const led = document.getElementById(`led_${ev.id}`);
    const ind = document.getElementById(`ind_${ev.id}`);
    const panel = document.getElementById(`panel_${ev.id}`);
    
    if(ev.type === 'on') {
      if(led) led.setAttribute('fill', `rgb(${PATCH_DATA[ev.id].rgb})`);
      if(ind) ind.classList.add('active');
      if(panel) panel.classList.add('playing');
    }
    if(ev.type === 'off') {
      if(led) led.setAttribute('fill', '#3f3f46');
      if(ind) ind.classList.remove('active');
      if(panel) panel.classList.remove('playing');
    }
    
    if(ev.type === 'keyOn' && ev.note !== null) {
      const isBlack = BL.includes(ev.note);
      const kEl = document.getElementById(`k${isBlack?'b':'w'}_${ev.id}_${ev.note}`);
      if(kEl) kEl.classList.add('on');
    }
    if(ev.type === 'keyOff' && ev.note !== null) {
      const isBlack = BL.includes(ev.note);
      const kEl = document.getElementById(`k${isBlack?'b':'w'}_${ev.id}_${ev.note}`);
      if(kEl) kEl.classList.remove('on');
    }
  }
  
  raf = requestAnimationFrame(uiLoop);
}

function setPlaybackState(active) {
  const p = document.getElementById('playBtn');
  const s = document.getElementById('stopBtn');
  if(active) {
    p.classList.replace('text-zinc-950', 'text-zinc-600');
    p.classList.replace('bg-amber-600', 'bg-zinc-800');
    p.classList.replace('border-amber-500', 'border-zinc-700');
    p.classList.remove('hover:bg-amber-500', 'shadow-[0_0_10px_rgba(245,158,11,0.4)]');
    p.disabled = true;
    
    s.classList.replace('text-zinc-300', 'text-zinc-950');
    s.classList.replace('bg-zinc-800', 'bg-amber-600');
    s.classList.replace('border-zinc-700', 'border-amber-500');
    s.classList.add('hover:bg-amber-500');
    s.disabled = false;
  } else {
    p.classList.replace('text-zinc-600', 'text-zinc-950');
    p.classList.replace('bg-zinc-800', 'bg-amber-600');
    p.classList.replace('border-zinc-700', 'border-amber-500');
    p.classList.add('hover:bg-amber-500', 'shadow-[0_0_10px_rgba(245,158,11,0.4)]');
    p.textContent = '▶ Boot';
    p.disabled = false;
    
    s.classList.replace('text-zinc-950', 'text-zinc-300');
    s.classList.replace('bg-amber-600', 'bg-zinc-800');
    s.classList.replace('border-amber-500', 'border-zinc-700');
    s.classList.remove('hover:bg-amber-500');
    s.disabled = true;
  }
}

function stopSong() {
  isPlaying = false;
  cancelAnimationFrame(raf);
  setPlaybackState(false);
  document.getElementById('timer').textContent = "0:00";
  
  document.querySelectorAll('.note-indicator').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.schematic-panel').forEach(el => el.classList.remove('playing'));
  document.querySelectorAll('.kw.on, .kb.on').forEach(el => el.classList.remove('on'));
  document.querySelectorAll('[id^=led_]').forEach(el => el.setAttribute('fill', '#3f3f46'));
  
  if(ac) {
    Object.keys(tracks).forEach(id => {
      const v = tracks[id];
      v.out.gain.cancelScheduledValues(ac.currentTime);
      v.out.gain.setTargetAtTime(0, ac.currentTime, 0.05);
      setTimeout(() => {
        v.all.forEach(o=>{ try{o.stop()}catch(e){} });
        v.out.disconnect();
      }, 200);
    });
  }
  for(const k in tracks) delete tracks[k];
  uiEvents = [];
}

function triggerPlay() {
  const pBtn = document.getElementById('playBtn');
  pBtn.disabled = true;
  pBtn.textContent = 'BOOTING...';
  setTimeout(bootSystem, 30);
}

document.addEventListener('click', e => {
  const p = e.target.closest('#playBtn');
  const s = e.target.closest('#stopBtn');
  if (p && !p.disabled) triggerPlay();
  if (s && !s.disabled) stopSong();
  
  const scopeChip = e.target.closest('.scope-chip');
  if (scopeChip) {
    scopeMode = +scopeChip.dataset.m;
    document.querySelectorAll('.scope-chip').forEach(x => x.classList.toggle('on', x === scopeChip));
  }
});

let faderDrag = null;
document.body.addEventListener('pointerdown', e => {
  const fader = e.target.closest('[data-fader]');
  if (fader) {
    const fid = fader.dataset.fader;
    faderDrag = { id: fid, y: e.clientY, v: mixState[fid] };
    fader.setPointerCapture(e.pointerId);
  }
});
document.body.addEventListener('pointermove', e => {
  if (faderDrag) {
    const cfg = MIX_CFG.find(c => c.id === faderDrag.id);
    const deltaY = faderDrag.y - e.clientY;
    const sensitivity = cfg.max / 60;
    let newV = faderDrag.v + deltaY * sensitivity;
    newV = Math.max(0, Math.min(cfg.max, newV));
    mixState[faderDrag.id] = newV;
    
    const fy = 290 - (newV / cfg.max) * 60;
    document.getElementById('fader_' + faderDrag.id).setAttribute('y', fy - 10);
    document.getElementById('fline_' + faderDrag.id).setAttribute('y1', fy);
    document.getElementById('fline_' + faderDrag.id).setAttribute('y2', fy);
    
    if (ac) {
      if (faderDrag.id === 'master') {
        if(outG) outG.gain.setTargetAtTime(newV, ac.currentTime, 0.05);
      } else if (tracks[faderDrag.id] && tracks[faderDrag.id].out) {
        tracks[faderDrag.id].out.gain.setTargetAtTime(newV, ac.currentTime, 0.05);
      }
    }
  }
});
const endDrag = () => { faderDrag = null; };
document.body.addEventListener('pointerup', endDrag);
document.body.addEventListener('pointercancel', endDrag);

const cv = document.getElementById('cv');
const cx = cv.getContext('2d');

function drawScope() {
  if(!isPlaying) {
    cx.clearRect(0,0,cv.width,cv.height);
    return;
  }
  requestAnimationFrame(drawScope);
  
  const d = window.devicePixelRatio || 1;
  const w = cv.clientWidth * d;
  const h = cv.clientHeight * d;
  
  if (cv.width !== w || cv.height !== h) {
    cv.width = w;
    cv.height = h;
  }
  
  cx.globalCompositeOperation = 'source-over';
  cx.fillStyle = '#020617'; 
  cx.fillRect(0, 0, w, h);
  
  cx.strokeStyle = 'rgba(74, 222, 128, 0.1)';
  cx.lineWidth = 1;
  cx.beginPath();
  for(let i=1; i<4; i++) {
    cx.moveTo(0, h * i / 4); cx.lineTo(w, h * i / 4);
    cx.moveTo(w * i / 4, 0); cx.lineTo(w * i / 4, h);
  }
  cx.stroke();

  cx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
  cx.beginPath();
  cx.moveTo(0, h/2);
  cx.lineTo(w, h/2);
  cx.stroke();
  
  cx.globalCompositeOperation = 'screen';
  cx.lineWidth = 2 * d;
  
  Object.keys(tracks).forEach(id => {
    const track = tracks[id];
    if(!track.an) return;
    
    const rgb = PATCH_DATA[id].rgb;
    cx.strokeStyle = `rgba(${rgb}, 0.9)`;
    cx.fillStyle = `rgba(${rgb}, 0.7)`;
    cx.shadowColor = `rgb(${rgb})`;
    cx.shadowBlur = 4;
    
    if (scopeMode === 1) {
      const b = new Uint8Array(track.an.frequencyBinCount);
      track.an.getByteFrequencyData(b);
      
      let active = false;
      for(let j=0; j<50; j+=5) { if(b[j] > 5) { active = true; break; } }
      if(!active) return;
      
      const n = 120;
      for (let i = 0; i < n; i++) {
        const k = Math.floor(Math.pow(b.length * 0.6, i / n));
        const v = b[k] / 255;
        if(v > 0.01) {
          cx.fillRect(i * w / n + 1, h - v * h, w / n - 2, v * h);
        }
      }
    } else {
      const b = new Float32Array(track.an.fftSize);
      track.an.getFloatTimeDomainData(b);
      
      let active = false;
      for(let j=0; j<256; j+=8) { if(Math.abs(b[j]) > 0.01) { active = true; break; } }
      if(!active) return;
      
      let offset = 0;
      for (let i = 1; i < b.length / 2; i++) {
        if (b[i - 1] < 0 && b[i] >= 0) { offset = i; break; }
      }
      
      cx.beginPath();
      for (let i = 0; i < 1024; i++) {
        const val = b[offset + i];
        const x = i * w / 1024;
        const y = h / 2 - val * h * 0.8; 
        i ? cx.lineTo(x, y) : cx.moveTo(x, y);
      }
      cx.stroke();
    }
  });
  cx.shadowBlur = 0;
}
