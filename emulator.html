    <script>
        // --- 1. PATCH DATABASE (Transcribed from PDF) ---
        // Format: [Scale, Wave, Pitch, PW, Port, FmM, FmE] | [Fc, Peak, FcM, FcE] | [VCA (Ignored/Hardwired on MS10)] | [MgWave, MgFreq] | [Hold, Att, Dec, Sus, Rel]
        // cables: [['SRC', 'DEST']]
        const patches = [
            { id: 'tpt_a', name: 'Trumpet (A)', cat: 'Instrument', desc: 'Strong tonguing attack for marches[cite: 2].',
              vco: [8, 'saw', 0, '', 0, 1, 0], vcf: [5, 3, 0, 10], mg: ['tri', 3.5], eg: [0, 1, 2, 7, 1], cables: [] },

            { id: 'oboe', name: 'Oboe', cat: 'Instrument', desc: 'Heavy double reed sound[cite: 4].',
              vco: [8, 'sqr', 0, '2', 0, 1, 0], vcf: [6.5, 4, 0, 7], mg: ['tri', 3.5], eg: [0, 1, 3, 7, 1], cables: [] },
            { id: 'ocarina', name: 'Ocarina', cat: 'Instrument', desc: 'Darker tone color than a flute[cite: 4].',

            { id: 'violin', name: 'Violin', cat: 'Instrument', desc: 'Sawtooth with moderate harmonics[cite: 5].',
              vco: [8, 'saw', 0, '', 2, 1, 0], vcf: [7.5, 4, 0, 0], mg: ['tri', 3.5], eg: [0, 1.5, 0, 10, 1], cables: [] },
            { id: 'cello', name: 'Cello', cat: 'Instrument', desc: 'Good for slow melodies. Use wheel for vibrato[cite: 5].',
              vco: [32, 'saw', 0, '', 3, 0, 1.5], vcf: [5.5, 7, 0, 0], mg: ['tri', 3.5], eg: [0, 1.5, 0, 10, 1], cables: [['EG_OUT', 'VCA_IN'], ['MG_OUT', 'VCO_FM']] }, // Replicated wheel mod patch
            { id: 'acc', name: 'Accordion', cat: 'Instrument', desc: 'Slow PWM creates a two-voice effect[cite: 6].',
              vco: [16, 'sqr', 0, '', 0, 0, 0], vcf: [7.5, 3, 0, 0], mg: ['tri', 0], eg: [0, 1, 3, 6.5, 1], cables: [['MG_OUT', 'VCO_FM']] }, // MG to PWM representation
            { id: 'epiano', name: 'Electric Piano', cat: 'Instrument', desc: 'VCF FcM gives tremolo effect[cite: 6].',
              vco: [8, 'sqr', 0, '', 0, 0, 0], vcf: [5, 3, 3, 6], mg: ['tri', 3.5], eg: [0, 0, 1.5, 3, 1], cables: [] },
            { id: 'clav', name: 'Clavinet', cat: 'Instrument', desc: 'Controlled by VCO waveform PW/PWM[cite: 7].',
              vco: [16, 'sqr', 0, '8', 0, 0, 0], vcf: [10, 0, 0, 0], mg: ['tri', 0], eg: [0, 0, 1, 2, 0], cables: [] },
            { id: 'banjo', name: 'Banjo', cat: 'Instrument', desc: 'Rounded to sharp harsh decay[cite: 7].',
              vco: [8, 'sqr', 0, '2', 0, 0, 0], vcf: [7, 2, 0, 3], mg: ['tri', 0], eg: [0, 0, 0, 0, 1], cables: [['EG_OUT', 'VCF_FC']] },
            { id: 'bass', name: 'Electric Bass', cat: 'Instrument', desc: 'Low scale 32\' for playing bass patterns[cite: 8].',
              vco: [32, 'saw', 0, '', 0, 0, 0], vcf: [4.5, 7, 0, 6], mg: ['tri', 0], eg: [0, 0, 1.5, 3, 1], cables: [] },
            { id: 'timpani', name: 'Timpani', cat: 'Instrument', desc: 'Mix pink noise with VCO triangle[cite: 8].',
              vco: [32, 'tri', 0, '', 0, 0, 0], vcf: [4.5, 7, 0, 4], mg: ['tri', 0], eg: [0, 0, 2, 0, 2], cables: [['NG_OUT', 'EXT_SIG']] },
            { id: 'cowbell', name: 'Cow-bell', cat: 'Instrument', desc: 'VCF self-oscillation as sound source[cite: 9].',
              vco: [0, 'sqr', 0, '', 0, 0, 0], vcf: [5, 10, 0, 2], mg: ['tri', 0], eg: [0, 0, 0, 0, 0], cables: [['EG_OUT', 'VCF_FC']] },
            { id: 'whistle', name: 'Whistle', cat: 'Instrument', desc: 'Noise modulates VCO for breathiness[cite: 9].',
              vco: [4, 'tri', '+5', '', 6, 1, 1], vcf: [6, 4, 0, 0], mg: ['tri', 3.5], eg: [0, 2.5, 3.5, 3.5, 1], cables: [['NG_OUT', 'VCO_FM']] },
            { id: 'syn1', name: 'Synthe 1', cat: 'Synth', desc: 'Progressive rock synthesizer[cite: 10].',
              vco: [32, 'sqr', 0, '2', 2, 0, 0], vcf: [6.5, 7.5, 0, 8], mg: ['tri', 0.5], eg: [0, 0, 3, 7, 3], cables: [['EG_OUT', 'VCO_FM']] },
            { id: 'syn2', name: 'Synthe 2', cat: 'Synth', desc: 'Control wheel pitch bend setup[cite: 10].',
              vco: [16, 'saw', 0, '', 3, 0, 4.5], vcf: [6.5, 7, 0, 0], mg: ['tri', 0], eg: [0, 0, 2, 5, 0], cables: [['MOD_WHEEL', 'VCO_FM']] },
            { id: 'syn3', name: 'Synthe 3', cat: 'Synth', desc: 'Auto-wah effect via MG to VCF[cite: 11].',
              vco: [8, 'sqr', 0, '5', 0, 0, 0], vcf: [4.5, 7.5, 4, 7], mg: ['tri', 3], eg: [0, 0.5, 2, 3, 2], cables: [] },
            { id: 'syn4', name: 'Synthe 4', cat: 'Synth', desc: 'Typical TV drama theme synth[cite: 11].',
              vco: [16, 'sqr', 0, '5', 0, 1, 3], vcf: [5.5, 8, 0, 10], mg: ['tri', 4], eg: [0, 1, 1, 7, 1], cables: [['MG_OUT', 'VCO_FM']] },
            { id: 'star', name: 'Falling Star', cat: 'SFX', desc: 'MG and EG drop the pitch of self-oscillating VCF[cite: 12].',
              vco: [0, 'sqr', 0, '', 0, 0, 0], vcf: [6, 10, 6, 8], mg: ['tri', 5], eg: [7, 0, 5, 0, 0], cables: [] },
            { id: 'gun', name: 'Machine Gun', cat: 'SFX', desc: 'MG rapidly changes VCF pitch[cite: 12].',
              vco: [0, 'sqr', 0, '', 0, 0, 0], vcf: [4, 10, 10, 0], mg: ['sqr', 6], eg: [0, 0, 10, 0, 10], cables: [] },
            { id: 'tel', name: 'Telephone', cat: 'SFX', desc: 'MG rectangle output triggers the EG[cite: 13].',
              vco: [4, 'sqr', 0, '', 0, 0, 2], vcf: [5, 9, 0, 7], mg: ['tri', 1], eg: [0, 0, 0, 10, 0], cables: [['MG_OUT', 'TRIG_IN'], ['EG_OUT', 'VCA_IN'], ['MG_OUT', 'VCF_FC']] },
            { id: 'siren', name: 'Police Siren', cat: 'SFX', desc: 'MG saw modulates VCO[cite: 13].',
              vco: [8, 'sqr', 0, '', 0, 5, 0], vcf: [5, 5, 0, 0], mg: ['saw', 2], eg: [0, 0, 0, 10, 0], cables: [] },
            { id: 'dog', name: 'Dog Barking', cat: 'SFX', desc: 'Envelope changes pitch and color simultaneously[cite: 14].',
              vco: [8, 'sqr', 0, '2', 0, 0, 3], vcf: [4, 7.5, 0, 7], mg: ['tri', 0], eg: [0, 0.5, 3, 0, 1], cables: [] },
            { id: 'ghost', name: 'Ghost', cat: 'SFX', desc: 'EG REV OUT slowly changes VCO pitch[cite: 14].',
              vco: [4, 'sqr', 0, '2', 0, 2, 2], vcf: [5, 6, 0, 5], mg: ['saw', 3], eg: [0, 2, 4, 3, 1.5], cables: [['EG_REV', 'VCO_FM']] },
            { id: 'storm', name: 'Storm', cat: 'SFX', desc: 'Play keys to increase wind[cite: 15].',
              vco: [0, 'noise', 0, '', 0, 0, 0], vcf: [5, 8, 0, 5], mg: ['tri', 0], eg: [6, 5, 6, 10, 6], cables: [['EG_OUT', 'VCA_IN']] },
            { id: 'lightning', name: 'Lightning', cat: 'SFX', desc: 'Pink noise added to white noise, distorting VCF[cite: 15].',
              vco: [0, 'noise', 0, '', 6, 0, 0], vcf: [5, 8, 2, 8], mg: ['sqr', 0], eg: [5, 0, 10, 5, 10], cables: [['NG_OUT', 'EXT_SIG']] },
            { id: 'wave', name: 'Wave on Cliff', cat: 'SFX', desc: 'Waves approaching and crashing[cite: 16].',
              vco: [0, 'noise', 0, '', 2, 0, 0], vcf: [6.5, 0, 0, 9], mg: ['tri', 0], eg: [7.5, 7, 1, 3, 1.5], cables: [['EG_REV', 'VCF_FC'], ['EG_OUT', 'VCA_IN']] },
            { id: 'jet', name: 'Jet', cat: 'SFX', desc: 'EG modulation raises pitch, moves away[cite: 16].',
              vco: [4, 'sqr', 0, '2', 0, 0, 5], vcf: [5, 5, 0, 10], mg: ['tri', 0], eg: [9, 10, 0, 10, 10], cables: [['EG_REV', 'VCO_FM'], ['NG_OUT', 'VCO_PW']] }
        ];

        let activePatch = patches[0];

        // --- 2. AUTHENTIC SVG SCHEMATIC GENERATOR ---
        function drawSchematic(p) {
            const valStr = v => v === '' ? '' : v.toString();
            const rot = v => (v === '' ? -135 : (Number(v) / 10) * 270 - 135);
            
            const knob = (x, y, label, val) => `
                <g transform="translate(${x},${y})">
                    <circle cx="0" cy="0" r="15" fill="#fff" stroke="#000" stroke-width="1.5"/>
                    ${val !== '' ? `<line x1="0" y1="0" x2="0" y2="-15" stroke="#000" stroke-width="2" transform="rotate(${rot(val)})"/>` : ''}
                    <text x="0" y="-20" class="label" text-anchor="middle">${label}</text>
                    <text x="0" y="5" class="val" text-anchor="middle">${valStr(val)}</text>
                </g>`;
                
            const rotary = (x, y, label, val, type) => {
                let r = -135, disp = val;
                if(type === 'scale' && val !== 0) {
                    const i = [32, 16, 8, 4].indexOf(val);
                    r = -45 + (i * 30); disp = val + "'";
                } else if (type === 'wave' && val !== 0) {
                    const i = ['tri', 'saw', 'sqr', 'noise'].indexOf(val);
                    r = -45 + (i * 30); 
                    disp = val === 'sqr' ? '⎍' : val === 'tri' ? '◺' : val === 'saw' ? '◿' : '〰';
                }
                return `
                <g transform="translate(${x},${y})">
                    <circle cx="0" cy="0" r="18" fill="#fff" stroke="#000" stroke-width="1.5"/>
                    <line x1="0" y1="0" x2="0" y2="-18" stroke="#000" stroke-width="2" transform="rotate(${r})"/>
                    <text x="0" y="-25" class="label" text-anchor="middle">${label}</text>
                    <text x="0" y="6" class="val" text-anchor="middle" font-family="monospace">${disp === 0 ? '' : disp}</text>
                </g>`;
            };

            const jacks = {
                'VCO_FM': {x: 770, y: 70}, 'VCF_FC': {x: 820, y: 70}, 'VCA_IN': {x: 870, y: 70}, 'EXT_SIG': {x: 920, y: 70},
                'MG_OUT': {x: 770, y: 130}, 'EG_OUT': {x: 820, y: 130}, 'EG_REV': {x: 870, y: 130}, 'TRIG_IN': {x: 920, y: 130},
                'NG_OUT': {x: 770, y: 190}, 'MOD_WHEEL': {x: 35, y: 180}
            };

            const jack = (id, label) => `
                <g transform="translate(${jacks[id].x},${jacks[id].y})">
                    <polygon points="-8,-4 -4,-10 4,-10 8,-4 8,4 4,10 -4,10 -8,4" fill="#ddd" stroke="#000"/>
                    <circle cx="0" cy="0" r="5" fill="#fff"/><circle cx="0" cy="0" r="2.5" fill="#000"/>
                    <text x="0" y="-15" class="label" font-size="9" text-anchor="middle">${label}</text>
                </g>`;

            const cable = (f, t) => {
                const p1 = jacks[f], p2 = jacks[t];
                if(!p1 || !p2) return '';
                return `<path class="cable" d="M ${p1.x} ${p1.y} C ${p1.x} ${p1.y+60}, ${p2.x} ${p2.y+60}, ${p2.x} ${p2.y}"/>`;
            };

            // 37 Key F-F Layout (22 White Keys)
            let keys = '';
            for(let i=0; i<22; i++) {
                keys += `<rect class="key w-key" data-note="${53+i}" x="${70 + (i*40)}" y="250" width="40" height="110" fill="#fff" stroke="#000"/>`;
            }
            const blackOffsets = [1, 2, 4, 5, 6, 8, 9, 11, 12, 13, 15, 16, 18, 19, 20];
            blackOffsets.forEach(i => {
                keys += `<rect class="key b-key" data-note="${53+i}" x="${70 + (i*40) - 12}" y="250" width="24" height="65" fill="#000" stroke="#000"/>`;
            });

            return `
            <svg viewBox="0 0 1000 360" class="ms10-svg">
                <!-- Panel Lines -->
                <line x1="70" y1="0" x2="70" y2="250" stroke-width="1.5"/><line x1="310" y1="0" x2="310" y2="250" stroke-width="1.5"/>
                <line x1="470" y1="0" x2="470" y2="250" stroke-width="1.5"/><line x1="600" y1="0" x2="600" y2="360" stroke-width="1.5"/>
                <line x1="740" y1="0" x2="740" y2="360" stroke-width="1.5"/><line x1="70" y1="125" x2="600" y2="125" stroke-width="1.5"/>
                <line x1="70" y1="250" x2="1000" y2="250" stroke-width="2"/>
                
                <text x="190" y="20" class="val" text-anchor="middle">VCO</text><text x="390" y="20" class="val" text-anchor="middle">VCF</text>
                <text x="535" y="20" class="val" text-anchor="middle">VCA</text><text x="670" y="20" class="val" text-anchor="middle">EG</text>

                <!-- Wheel -->
                <rect x="20" y="140" width="30" height="90" fill="#222" rx="4"/>
                <line x1="35" y1="150" x2="35" y2="220" stroke="#fff" stroke-width="2"/>

                <!-- VCO -->
                ${rotary(140, 70, "SCALE", p.vco[0], 'scale')} ${rotary(240, 70, "WAVEFORM", p.vco[1], 'wave')}
                ${knob(140, 190, "PITCH", p.vco[2])} ${knob(240, 190, "PW/PWM", p.vco[3])}
                
                <text x="190" y="140" class="val" text-anchor="middle">FM</text>
                ${knob(190, 170, "MG", p.vco[5])} ${knob(190, 225, "EG/EXT", p.vco[6])}
                
                <!-- VCF -->
                ${knob(390, 60, "fc", p.vcf[0])} ${knob(390, 115, "PEAK", p.vcf[1])}
                <text x="390" y="150" class="val" text-anchor="middle">fc M</text>
                ${knob(350, 200, "MG", p.vcf[2])} ${knob(430, 200, "EG/EXT", p.vcf[3])}

                <!-- VCA -->
                <polygon points="515,60 555,85 515,110" fill="#fff" stroke-width="1.5"/>
                <text x="535" y="120" class="label" text-anchor="middle">EG & EXT</text>

                <!-- MG -->
                <text x="535" y="145" class="val" text-anchor="middle">MG</text>
                ${rotary(535, 180, "WAVEFORM", p.mg[0], 'wave')} ${knob(535, 235, "FREQ", p.mg[1])}

                <!-- EG -->
                ${knob(670, 50, "HOLD", p.eg[0])} ${knob(670, 100, "ATTACK", p.eg[1])}
                ${knob(670, 150, "DECAY", p.eg[2])} ${knob(670, 200, "SUSTAIN", p.eg[3])}
                ${knob(670, 250, "RELEASE", p.eg[4])}

                <!-- Patch Bay -->
                ${jack('VCO_FM', 'FM')} ${jack('VCF_FC', 'fcM')} ${jack('VCA_IN', 'IN')} ${jack('EXT_SIG', 'EXT SIG')}
                ${jack('MG_OUT', 'MG')} ${jack('EG_OUT', 'EG')} ${jack('EG_REV', 'REV')} ${jack('TRIG_IN', 'TRIG')}
                ${jack('NG_OUT', 'NG')}
                
                ${p.cables.map(c => cable(c[0], c[1])).join('')}
                ${keys}
            </svg>`;
        }

        // --- 3. WEB AUDIO SYNTH ENGINE ---
        let audioCtx, analyser, masterGain;
        let activeVoice = null;
        let scopeInterval = null;

        const mapFreq = v => 40 * Math.pow(2, v * 0.9);
        const mapTime = v => v === 0 ? 0.005 : 0.05 * Math.pow(1.6, v);

        function initAudio() {
            if(audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 1024;
            
            const comp = audioCtx.createDynamicsCompressor();
            comp.threshold.value = -12; comp.ratio.value = 12;
            
            masterGain = audioCtx.createGain();
            masterGain.gain.value = 1.0;
            
            analyser.connect(comp).connect(masterGain).connect(audioCtx.destination);
            startScope();
        }

        function playNote(freq) {
            initAudio();
            if(activeVoice) activeVoice.stop();
            
            const now = audioCtx.currentTime;
            const p = activePatch;
            
            const vco = audioCtx.createOscillator();
            const vcf = audioCtx.createBiquadFilter();
            const vca = audioCtx.createGain();
            const mg = audioCtx.createOscillator();
            
            // Oscillator / Noise
            if(p.vco[1] === 'noise') {
                const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * 2, audioCtx.sampleRate);
                const data = buf.getChannelData(0);
                for(let i=0; i<data.length; i++) data[i] = Math.random() * 2 - 1;
                vco.buffer = buf;
                vco.loop = true;
                Object.setPrototypeOf(vco, AudioBufferSourceNode.prototype);
            } else {
                vco.type = p.vco[1] === 'saw' ? 'sawtooth' : p.vco[1] === 'tri' ? 'triangle' : 'square';
                // Scale adjustment + Key Frequency
                const scaleMulti = p.vco[0] === 32 ? 0.25 : p.vco[0] === 16 ? 0.5 : p.vco[0] === 8 ? 1 : 2;
                vco.frequency.value = freq * scaleMulti;
            }
            
            // Filter
            vcf.type = 'lowpass';
            vcf.frequency.value = mapFreq(p.vcf[0]);
            vcf.Q.value = p.vcf[1] * 2; // Resonance

            // Modulation
            mg.type = p.mg[0] === 'tri' ? 'triangle' : 'square';
            mg.frequency.value = p.mg[1] === 0 ? 0.1 : p.mg[1] * 2;
            
            const vcfMod = audioCtx.createGain(); vcfMod.gain.value = p.vcf[2] * 400;
            const vcoMod = audioCtx.createGain(); vcoMod.gain.value = p.vco[5] * 50;
            
            mg.connect(vcfMod).connect(vcf.frequency);
            if(vco.detune) mg.connect(vcoMod).connect(vco.detune);

            // Envelopes
            const att = mapTime(p.eg[1]);
            const dec = mapTime(p.eg[2]);
            const sus = Math.max(p.eg[3] / 10, 0.001);
            
            vca.gain.setValueAtTime(0, now);
            
            // Trigger routing check
            const hasAutoTrig = p.cables.some(c => c[1] === 'TRIG_IN');
            if(hasAutoTrig) {
                const trig = audioCtx.createOscillator(); trig.type = 'square'; trig.frequency.value = mg.frequency.value;
                const tg = audioCtx.createGain(); tg.gain.value = 0.5;
                trig.connect(tg).connect(vca.gain);
                trig.start(now);
                activeVoice = { stop: () => { trig.stop(); vco.stop(); mg.stop(); } };
            } else {
                vca.gain.linearRampToValueAtTime(1.0, now + att);
                vca.gain.exponentialRampToValueAtTime(sus, now + att + dec);
                
                if(p.vcf[3] > 0) {
                    const depth = p.vcf[3] * 600;
                    vcf.frequency.setValueAtTime(mapFreq(p.vcf[0]), now);
                    vcf.frequency.linearRampToValueAtTime(mapFreq(p.vcf[0]) + depth, now + att);
                    vcf.frequency.exponentialRampToValueAtTime(mapFreq(p.vcf[0]) + (depth * sus), now + att + dec);
                }
            }

            vco.connect(vcf).connect(vca).connect(analyser);
            
            vco.start(now); mg.start(now);

            activeVoice = {
                stop: () => {
                    const t = audioCtx.currentTime;
                    vca.gain.cancelScheduledValues(t);
                    vca.gain.setValueAtTime(vca.gain.value, t);
                    vca.gain.linearRampToValueAtTime(0.001, t + mapTime(p.eg[4]));
                    setTimeout(() => { vco.stop(); mg.stop(); }, mapTime(p.eg[4]) * 1000 + 100);
                }
            };
        }

        function releaseNote() {
            if(activeVoice && !activePatch.cables.some(c => c[1] === 'TRIG_IN')) activeVoice.stop();
        }

        // --- 4. VISUALIZATION ---
        function startScope() {
            const canvas = document.getElementById('scope');
            const ctx = canvas.getContext('2d');
            canvas.width = canvas.clientWidth * window.devicePixelRatio;
            canvas.height = canvas.clientHeight * window.devicePixelRatio;
            
            const buffer = new Float32Array(analyser.frequencyBinCount);
            
            function draw() {
                requestAnimationFrame(draw);
                analyser.getFloatTimeDomainData(buffer);
                
                ctx.fillStyle = '#050505'; ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.lineWidth = 2 * window.devicePixelRatio; ctx.strokeStyle = '#a78bfa';
                ctx.beginPath();
                
                const slice = canvas.width / buffer.length;
                let x = 0;
                for(let i = 0; i < buffer.length; i++) {
                    const y = (buffer[i] * canvas.height / 2.5) + (canvas.height / 2);
                    if(i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
                    x += slice;
                }
                ctx.stroke();
            }
            draw();
        }

        // --- 5. INITIALIZATION ---
        function loadPatch(idx) {
            activePatch = patches[idx];
            document.getElementById('patch-title').innerText = activePatch.name;
            document.getElementById('patch-desc').innerText = activePatch.desc;
            document.getElementById('schematic-container').innerHTML = drawSchematic(activePatch);
            
            document.querySelectorAll('#patch-list button').forEach((b, i) => {
                b.className = `text-left px-3 py-2 rounded text-sm font-mono transition-colors ${i === idx ? 'bg-purple-600 text-white' : 'text-zinc-400 hover:bg-zinc-800'}`;
            });

            // Re-bind SVG keys
            document.querySelectorAll('.key').forEach(k => {
                k.addEventListener('mousedown', (e) => {
                    e.target.classList.add('active');
                    playNote(440 * Math.pow(2, (parseInt(e.target.dataset.note) - 69) / 12));
                });
                k.addEventListener('mouseup', (e) => {
                    e.target.classList.remove('active');
                    releaseNote();
                });
                k.addEventListener('mouseleave', (e) => {
                    e.target.classList.remove('active');
                    releaseNote();
                });
            });
        }

        const list = document.getElementById('patch-list');
        patches.forEach((p, i) => {
            const btn = document.createElement('button');
            btn.innerText = `${String(i+1).padStart(2, '0')}. ${p.name}`;
            btn.onclick = () => loadPatch(i);
            list.appendChild(btn);
        });

        loadPatch(0);
    </script>
</body>
</html>
